name: APK bauen

on:
  push:
    paths-ignore:
      - 'tipps.json'
      - 'missionen.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        run: gradle assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk GTA6-Guide.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GTA6-Guide
          path: GTA6-Guide.apk

      - name: Als Release veröffentlichen (direkter APK-Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: GTA 6 Guide v${{ github.run_number }}
          files: GTA6-Guide.apk
